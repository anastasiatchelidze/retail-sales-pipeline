services:

  postgres:
    image: postgres:16
    container_name: retail_postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retail_db}
      POSTGRES_USER: ${POSTGRES_USER:-retail_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retail_password}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-retail_user} -d ${POSTGRES_DB:-retail_db}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: retail_airflow_init

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${POSTGRES_USER:-retail_user}:${POSTGRES_PASSWORD:-retail_password}@postgres:5432/${POSTGRES_DB:-retail_db}

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW_CONN_RETAIL_POSTGRES: >-
        postgresql://${POSTGRES_USER:-retail_user}:${POSTGRES_PASSWORD:-retail_password}@postgres:5432/${POSTGRES_DB:-retail_db}

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-retail_db}
      POSTGRES_USER: ${POSTGRES_USER:-retail_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retail_password}

      KAGGLE_API_TOKEN: ${KAGGLE_API_TOKEN}

      DATA_DIR: /opt/airflow/data
      SQL_DIR: /opt/airflow/sql

    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true

    volumes:
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs


  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: retail_airflow_webserver

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${POSTGRES_USER:-retail_user}:${POSTGRES_PASSWORD:-retail_password}@postgres:5432/${POSTGRES_DB:-retail_db}

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW_CONN_RETAIL_POSTGRES: >-
        postgresql://${POSTGRES_USER:-retail_user}:${POSTGRES_PASSWORD:-retail_password}@postgres:5432/${POSTGRES_DB:-retail_db}

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-retail_db}
      POSTGRES_USER: ${POSTGRES_USER:-retail_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retail_password}

      KAGGLE_API_TOKEN: ${KAGGLE_API_TOKEN}

      DATA_DIR: /opt/airflow/data
      SQL_DIR: /opt/airflow/sql

    ports:
      - "8080:8080"

    command:
      - airflow
      - webserver

    volumes:
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs


  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: retail_airflow_scheduler

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${POSTGRES_USER:-retail_user}:${POSTGRES_PASSWORD:-retail_password}@postgres:5432/${POSTGRES_DB:-retail_db}

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW_CONN_RETAIL_POSTGRES: >-
        postgresql://${POSTGRES_USER:-retail_user}:${POSTGRES_PASSWORD:-retail_password}@postgres:5432/${POSTGRES_DB:-retail_db}

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-retail_db}
      POSTGRES_USER: ${POSTGRES_USER:-retail_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retail_password}

      KAGGLE_API_TOKEN: ${KAGGLE_API_TOKEN}

      DATA_DIR: /opt/airflow/data
      SQL_DIR: /opt/airflow/sql

    command:
      - airflow
      - scheduler

    volumes:
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs


volumes:
  postgres_data: